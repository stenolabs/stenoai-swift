name: Steno
options:
  bundleIdPrefix: org.steno
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - zh-Hant
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  StenoKit:
    path: StenoKit
  GemmaIPC:
    path: GemmaService/IPC
targets:
  Steno:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - App/Sources
      - Shared/Sources
      - App/Resources
      - Shared/Resources/AppIcon.icon
    dependencies:
      - package: StenoKit
        product: StenoDomain
      - package: StenoKit
        product: StenoLibrary
      - package: StenoKit
        product: StenoAudioCore
      - package: StenoKit
        product: StenoMacAudio
      - package: StenoKit
        product: StenoTranscription
      - package: StenoKit
        product: StenoPipeline
      - package: StenoKit
        product: StenoExchange
      - package: StenoKit
        product: StenoDemo
      - package: GemmaIPC
        product: StenoGemmaProcessGate
    info:
      path: App/Info.plist
      properties:
        # A distinct display name lets the native app coexist with the legacy
        # Electron app in /Applications. The bundle identifier stays
        # org.steno.Steno because it owns the native app's settings and does
        # not conflict with the legacy identifier, com.stenoai.recorder.
        CFBundleDisplayName: steno-macos
        NSMicrophoneUsageDescription: Steno records your microphone so it can transcribe conversations locally on this Mac.
        NSAudioCaptureUsageDescription: Steno records system audio so it can transcribe the people you talk to in calls, locally on this Mac.
        # EventKit read-only access (macOS 14+ semantics). Local-only:
        # events never leave the device, per docs/PLAN-PRIVACY.md.
        NSCalendarsFullAccessUsageDescription: Steno reads your calendar locally to remind you shortly before a meeting starts. Event details stay on this Mac.
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: org.steno.Steno.record
            CFBundleURLSchemes:
              - steno
              - stenoai
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.steno.sidebar-item
            UTTypeDescription: Steno Sidebar Item
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: org.steno.meeting-transfer
            UTTypeDescription: Steno Meeting
            UTTypeConformsTo:
              - public.archive
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - stenomeeting
        CFBundleDocumentTypes:
          - CFBundleTypeName: Steno Meeting
            LSItemContentTypes:
              - org.steno.meeting-transfer
            CFBundleTypeRole: Editor
    settings:
      base:
        ARCHS: arm64
        PRODUCT_NAME: steno-macos
        PRODUCT_BUNDLE_IDENTIFIER: "$(STENO_BUNDLE_IDENTIFIER)"
        # The macOS and iOS apps share one visual identity.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        STRING_CATALOG_GENERATE_SYMBOLS: true
        SWIFT_EMIT_LOC_STRINGS: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: false
        # TCC keys microphone and system-audio consent to the app's
        # designated requirement. "Sign to Run Locally" changes that identity
        # after every build and makes macOS prompt again or reject stale grants.
        CODE_SIGN_STYLE: Automatic
        # Config/Signing.xcconfig optionally includes the ignored local
        # .steno-signing.xcconfig when a stable development identity is wanted.
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: false
  StenoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
      - Shared/Tests
    dependencies:
      - target: Steno
      - package: GemmaIPC
        product: StenoGemmaProcessGate
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: org.steno.StenoTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/steno-macos.app/Contents/MacOS/steno-macos"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true

schemes:
  Steno:
    build:
      targets:
        Steno: all
    test:
      targets:
        - StenoTests
      # Pinned so a test never depends on the language the developer's Mac
      # happens to run in: user-facing strings are localized, and asserting on
      # them would otherwise pass or fail by accident.
      language: en
      region: US
      environmentVariables:
        STENO_TEST_ISOLATE_TEXT_MODEL_REGISTRY: "1"
